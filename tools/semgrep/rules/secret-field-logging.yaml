rules:
  - id: secret-field-logging
    languages: [python]
    severity: ERROR
    message: >-
      Never log decrypted secrets. Encrypted credential fields (_api_key, access/refresh
      tokens) must not reach a logger or print — they are write_only and read only via
      apps.secrets.credentials.decrypt_token. Logging them defeats encryption-at-rest.
    metadata:
      landmine: "CLAUDE.md > Backend wiring & security (encrypted secrets at rest)"
      category: security
    patterns:
      - pattern-either:
          - pattern: logger.$M(..., $X._api_key, ...)
          - pattern: logging.$M(..., $X._api_key, ...)
          - pattern: print(..., $X._api_key, ...)
          - pattern: logger.$M(..., $X.access_token, ...)
          - pattern: logger.$M(..., $X.refresh_token, ...)
          - pattern: logger.$M(f"...{$X._api_key}...")
          - pattern: logger.$M(f"...{$X.access_token}...")
