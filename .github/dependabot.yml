version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Wait 7 days before proposing newly published versions (supply-chain cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"

  # Keeps the digest-pinned base images (backend/Dockerfile, frontend/Dockerfile.dev) fresh.
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    # Wait 7 days before proposing newly published versions (supply-chain cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    # Wait 7 days before proposing newly published versions (supply-chain cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Wait 7 days before proposing newly published versions (supply-chain cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      django:
        patterns:
          - "django*"
          - "channels*"
          - "djangorestframework*"
      celery:
        patterns:
          - "celery*"
          - "django-celery-beat*"
          - "redis*"
      ai-sdks:
        patterns:
          - "anthropic*"
          - "openai*"
          - "tiktoken*"
      dev:
        dependency-type: development
    ignore:
      - dependency-name: "ty"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    # Wait 7 days before proposing newly published versions (supply-chain cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      tooling:
        patterns:
          - "vite*"
          - "vitest*"
          - "@vitejs/*"
          - "@vitest/*"
          - "eslint*"
          - "@eslint/*"
          - "typescript*"
          - "typescript-eslint"
      testing:
        patterns:
          - "@testing-library/*"
          - "jsdom"
