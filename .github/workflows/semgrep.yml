name: semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v6
      # Excluded rules are false positives for a single-user, 127.0.0.1-bound desktop
      # app: containers don't need a non-root USER (no shared host); the insecure-websocket
      # finding is internal to the compose network; csrf_exempt on upload is intentional.
      # p/secrets complements gitleaks (hardcoded-secret patterns). p/owasp-top-ten is
      # deliberately NOT added: it overlaps p/security-audit and only surfaced FPs here
      # (Dockerfile missing-user, a benign fallback log line, OpenAPI basic-auth scheme).
      - run: |
          semgrep ci \
            --config=p/default \
            --config=p/python \
            --config=p/django \
            --config=p/react \
            --config=p/typescript \
            --config=p/security-audit \
            --config=p/secrets \
            --exclude-rule=dockerfile.security.missing-user.missing-user \
            --exclude-rule=javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket \
            --exclude-rule=python.django.security.audit.csrf-exempt.no-csrf-exempt
      # Repo-specific landmine rules (CLAUDE.md silent-failures encoded as gates). The
      # fixtures live under tools/semgrep/rules/ and are NOT scanned (we target backend/).
      - name: Validate landmine rules against their fixtures
        run: semgrep --test --config tools/semgrep/rules tools/semgrep/rules
      - name: Landmine rules — scan backend (BLOCKING; 0 findings as of 2026-06-04)
        run: semgrep scan --error --config tools/semgrep/rules backend/
