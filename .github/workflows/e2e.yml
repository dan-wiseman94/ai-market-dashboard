name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Runs on PRs, on merge to main, and via manual dispatch. Browser lanes exec in
# `worker`, which carries chromium; pytest-xdist + pytest-playwright are in the
# lockfile.

permissions:
  contents: read

jobs:
  # Single build+run job covering the api lane (in `web`, no browser) and the ui
  # lane (in `worker`, which carries chromium). Lanes left off the PR gate:
  #   - ws: streaming tests time out waiting for Channels delta events (the worker
  #     runs the task but events aren't delivered to the ws client) — a pre-existing
  #     issue to stabilize separately before gating.
  #   - visual / a11y / perf: visual needs committed byte-diff baselines and perf
  #     needs a Lighthouse runner; run those via `make e2e` locally or on merge.
  ui:
    runs-on: ubuntu-latest
    # 35 minutes: schemathesis is bounded to ~5 min (see that step), leaving the
    # Playwright e2e/ui suite real headroom to complete.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
      - name: Provision .env
        run: |
          cp .env.example .env
          python3 -c "import secrets; print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(50))" >> .env
      - name: Build + start e2e stack
        run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build
      - name: Wait for web health
        run: |
          # web publishes no host port in the e2e stack — tls-proxy (which owns
          # 127.0.0.1:8000) is dev-profile-only and isn't started here, and the
          # lanes reach web via the `web:8000` Docker DNS name. So wait on web's
          # own container healthcheck rather than curling an unpublished host port.
          for i in $(seq 1 90); do
            cid=$(docker compose -f compose.yaml -f compose.e2e.yaml ps -q web)
            if [ -n "$cid" ] && [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null)" = healthy ]; then
              echo "web healthy"; exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yaml -f compose.e2e.yaml logs --tail=200
          exit 1
      - name: Run e2e/api lane
        # No browser needed — exec in `web`. --workdir /app so the e2e/ paths resolve
        # (web's WORKDIR is /app/backend); -m integration overrides the default
        # `-m 'not integration'` addopts. -n 2 is safe because the seed ladder
        # serializes via a Postgres advisory lock (see e2e/conftest.py).
        run: docker compose -f compose.yaml -f compose.e2e.yaml exec -T --workdir /app web uv run pytest e2e/api/ -n 2 -m integration -v
      - name: schemathesis — no endpoint 5xx-crashes under fuzzing
        # MOCK_EXTERNAL is on in the e2e overlay, so fuzzing every method is safe.
        # -c not_a_server_error: gate on crashes (real bugs), not strict response-schema
        # conformance (noisy against drf-spectacular's graceful-fallback schemas).
        # NOTE schemathesis 4.x repurposed `-n` ("workers" in 3.x) to mean --max-examples,
        # so `-n <k>` bounds examples and adds no parallelism (workers are `-w`).
        # -w 1 (single worker): schemathesis's parameter generator has a THREAD-SAFETY
        # race — concurrent workers mutate Hypothesis's shared strategy caches
        # mid-iteration and crash EVERY run (on a different operation each time; a 3×
        # retry does not help). One worker is race-free. To hold the time budget,
        # examples are bounded (-n 8) and only the crash-relevant phases run: `fuzzing`
        # (the actual "no 5xx" check) + `examples`. `coverage` (~70% of cases,
        # deterministic boundary gen) and the combinatorial `stateful` link-walk are
        # dropped to keep this ~5 min, leaving the 35-min job budget for the e2e/ui
        # Playwright suite.
        # --exclude-path: skip two operations that crash schemathesis's OWN parameter
        # generator (hypothesis "dictionary changed size during iteration" in
        # _hypothesis.generate_parameter, a tooling bug — the app never receives a request).
        # These are not app failures; revisit when schemathesis fixes the generator.
        # Retry 2× only guards a genuinely-transient infra hiccup.
        run: |
          sx() {
            docker compose -f compose.yaml -f compose.e2e.yaml exec -T --workdir /app web \
              uv run schemathesis run http://localhost:8000/api/schema/ -u http://localhost:8000 \
              -c not_a_server_error -w 1 -n 8 --phases examples,fuzzing \
              --exclude-path /api/dashboard/ --exclude-path /api/analytics/observer-timeline/
          }
          for attempt in 1 2; do
            echo "::group::schemathesis attempt ${attempt}/2"
            if sx; then echo "::endgroup::"; echo "schemathesis passed on attempt ${attempt}"; exit 0; fi
            echo "::endgroup::"; echo "schemathesis attempt ${attempt} failed, retrying"
          done
          echo "schemathesis failed after 2 attempts — a repeatable failure, not a hiccup"; exit 1
      - name: render-chart integration test (the /render/chart chromium path)
        # apps.snapshots.services.render.render_chart_png is the headless-chromium chart-image
        # pipeline. Its test is marked `integration`, so check.yml deselects it (`-m 'not
        # integration'`) and the other e2e steps only run the e2e/ dir — this step is its
        # only gate. `worker` carries chromium and the e2e overlay serves frontend:5173.
        run: docker compose -f compose.yaml -f compose.e2e.yaml exec -T --workdir /app worker uv run pytest backend/apps/snapshots/tests/test_render_chart.py -m integration -v
      - name: Run e2e/ui suite
        # Must exec in `worker` (carries the chromium playwright build), with --workdir /app
        # so pytest sees the repo-root layout (web's WORKDIR is /app/backend), and -m integration
        # to override the default `-m 'not integration'` addopts that would otherwise deselect
        # every e2e test. Mirrors `make e2e-ui`.
        # -n 1: one chromium at a time — keeps memory well under the runner's
        # ceiling and avoids cross-test interference on the shared DB. The lane is
        # ~11 min serially, comfortably inside the job timeout. Revisit raising
        # parallelism once this is reliably green in CI.
        run: docker compose -f compose.yaml -f compose.e2e.yaml exec -T --workdir /app worker uv run pytest e2e/ui/ -n 1 -m integration -v --tracing=retain-on-failure
      - name: Run e2e/a11y lane
        # axe-core scans (critical/serious wcag2a/2aa) over every route, in `worker`
        # (chromium). Green across all routes and GATING on PRs. -n 1: the
        # shared-DB seed contention races under parallelism (the visual lane hits
        # psycopg "another command is already in progress" under -n 2).
        run: docker compose -f compose.yaml -f compose.e2e.yaml exec -T --workdir /app worker uv run pytest e2e/a11y/ -n 1 -m integration -v
      - name: Run e2e/ws lane (advisory)
        # Streaming delta events can time out waiting on Channels delivery in CI
        # (documented pre-existing issue), so surface ws regressions without
        # blocking the PR. Drop continue-on-error once Channels delivery is stable.
        continue-on-error: true
        run: docker compose -f compose.yaml -f compose.e2e.yaml exec -T --workdir /app web uv run pytest e2e/ws/ -n 1 -m integration -v
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ui-traces
          path: e2e/artifacts/
          retention-days: 7
      - if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v
