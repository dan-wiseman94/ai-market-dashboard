name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Runs on PRs now that the worker/browser-host wiring is correct (pytest-xdist +
# pytest-playwright are in the lockfile, and the lanes exec in `worker`, which
# carries chromium). Also runs on merge to main and via manual dispatch.

permissions:
  contents: read

jobs:
  # Single build+run job covering the functional lanes: api/ws (in `web`, no
  # browser) and ui (in `worker`, which carries chromium). The visual / a11y /
  # perf lanes are deliberately left out of the PR gate — visual needs committed
  # byte-diff baselines and perf needs a Lighthouse runner; run those via
  # `make e2e` locally or on merge.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Provision .env
        run: |
          cp .env.example .env
          python3 -c "import secrets; print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(50))" >> .env
      - name: Build + start e2e stack
        run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build
      - name: Wait for web health
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/api/health/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker compose logs --tail=200
          exit 1
      - name: Run e2e/api + e2e/ws lanes
        # No browser needed — exec in `web`. --workdir /app so the e2e/ paths resolve
        # (web's WORKDIR is /app/backend); -m integration overrides the default
        # `-m 'not integration'` addopts. Mirrors the api/ws part of `make e2e`.
        run: docker compose -f compose.yaml -f compose.e2e.yaml exec -T --workdir /app web uv run pytest e2e/api/ e2e/ws/ -n 2 -m integration -v
      - name: Run e2e/ui suite
        # Must exec in `worker` (carries the chromium playwright build), with --workdir /app
        # so pytest sees the repo-root layout (web's WORKDIR is /app/backend), and -m integration
        # to override the default `-m 'not integration'` addopts that would otherwise deselect
        # every e2e test. Mirrors `make e2e-ui`.
        run: docker compose -f compose.yaml -f compose.e2e.yaml exec -T --workdir /app worker uv run pytest e2e/ui/ -n 4 --dist=loadscope -m integration -v --tracing=retain-on-failure
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-traces
          path: e2e/artifacts/
          retention-days: 7
      - if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml down -v
