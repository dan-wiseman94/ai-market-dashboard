name: flake-audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Bring up stack
        run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build
      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health/ >/dev/null; then
              break
            fi
            sleep 2
          done
      - name: Run flake audit
        run: python tools/flake_audit.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: flake_audit
          path: |
            flake_audit.json
            flake_audit_runs/

  weekly-issue:
    runs-on: ubuntu-latest
    needs: audit
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: flake_audit
          path: .
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('flake_audit.json', 'utf8'));
            if (data.flaky_count === 0) return;
            const rows = data.flaky.slice(0, 10)
              .map(t => `| \`${t.test}\` | ${(t.flake_rate * 100).toFixed(1)}% | ${t.passes}/${t.runs} |`)
              .join('\n');
            const date = new Date().toISOString().slice(0, 10);
            const body = [
              `## Weekly flake audit — ${date}`,
              ``,
              `Total tests: ${data.total_tests} | Flaky: ${data.flaky_count}`,
              ``,
              `### Top flaky tests`,
              ``,
              `| Test | Flake rate | Passes/Runs |`,
              `|------|-----------:|------------:|`,
              rows,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `E2E flake audit — ${date}`,
              body,
              labels: ['e2e', 'flake'],
            });

  # Per-commit CI runs the unit suite in deterministic order (-p no:randomly). This
  # nightly job runs it under pytest-randomly across several seeds to surface
  # order-dependence (e.g. the residual run_ai async-streaming flake) without redding
  # every commit. Informational (continue-on-error) — the order-dependent failures
  # are tracked here, not gated per-commit.
  unit-order-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ai_dashboard
          POSTGRES_USER: ai_dashboard
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U ai_dashboard"
          --health-interval 3s --health-timeout 2s --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 2s --health-retries 10
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-prod
      DJANGO_DEBUG: "1"
      POSTGRES_DB: ai_dashboard
      POSTGRES_USER: ai_dashboard
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - run: sudo mkdir -p /data && sudo chmod 777 /data
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11"
      - run: uv python install 3.13
      - run: uv sync --frozen --dev
      - name: Unit suite under randomized order (3 seeds, informational)
        continue-on-error: true
        run: |
          for n in 1 2 3; do
            echo "::group::randomized run $n"
            uv run pytest -q -p randomly || echo "::warning::randomized run $n surfaced failures (order-dependence)"
            echo "::endgroup::"
          done
