name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (matches compose.yaml `db` + compose.e2e.yaml `db-e2e`):
        # apps.recall's 0001 migration runs VectorExtension() (CREATE EXTENSION
        # vector). On a bare postgres image that aborts the whole test-DB build,
        # cascading to ~800 setup errors. Must ship the `vector` extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ai_dashboard
          POSTGRES_USER: ai_dashboard
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U ai_dashboard"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 10
        ports: ["6379:6379"]
    env:
      # config.settings.test = dev + InMemoryChannelLayer — the determinism guard for the
      # order-dependent channels_redis flake (see backend/config/settings/test.py + CLAUDE.md).
      # This env var overrides the pyproject [tool.pytest.ini_options] DJANGO_SETTINGS_MODULE,
      # so without it CI silently runs on channels_redis instead of the intended test layer.
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-prod
      DJANGO_DEBUG: "1"
      POSTGRES_DB: ai_dashboard
      POSTGRES_USER: ai_dashboard
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      PYTHONPATH: backend
      # The unit-level e2e/tests/ get collected here (not integration-marked), but e2e/conftest.py's
      # autouse _wait_for_stack session fixture blocks 60s waiting for a compose stack that the bare
      # backend runner doesn't have — killed by --timeout=60, erroring all of e2e/tests/. Take the
      # conftest's documented escape hatch for unit-level e2e tests. (Pre-existing main breakage.)
      E2E_SKIP_STACK_WAIT: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Provision /data (compose volume substitute on bare runner)
        run: sudo mkdir -p /data && sudo chmod 777 /data
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8"
      - run: uv python install 3.13
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: makemigrations --check (model/migration drift)
        run: uv run python backend/manage.py makemigrations --check --dry-run
      - name: import-linter (architecture contracts)
        # cwd is repo root (pyproject here); job env PYTHONPATH=backend makes `apps` importable.
        run: uv run lint-imports
      - name: mypy (ORM-aware, zero-baseline)
        # Zero-baseline gate: mypy must report no errors. mypy exits 1 on type errors and >=2 on
        # a crash (bad config / plugin / import failure) — either fails the step. (The legacy
        # mypy-baseline.txt ratchet was driven to 0 and removed, so no filter is needed.)
        run: uv run mypy backend/apps backend/config
      - name: deptry (dependency hygiene — unused / missing / transitively-used deps)
        # Runs AFTER uv sync (deps installed), so import→distribution mapping is accurate.
        run: uv run deptry backend
      - name: vulture (dead code) — advisory, non-blocking
        continue-on-error: true
        run: uv run vulture
      - name: OpenAPI schema is current (drift gate)
        # Regenerate and diff against the committed schema; any drift fails the build.
        run: |
          uv run python backend/manage.py spectacular --file /tmp/schema.yml --validate
          diff -u backend/schema.yml /tmp/schema.yml
      - name: ty (type-check) — advisory while ty is pre-1.0 / lacks Django ORM modeling
        continue-on-error: true
        run: uv run ty check backend
      - name: pytest (with coverage)
        # -p no:randomly: the per-commit gate runs in deterministic definition order.
        # pytest-randomly stays active locally + in the nightly flake-audit (flake-audit.yml)
        # to surface order-dependence over time (e.g. the residual run_ai async-streaming
        # flake) without redding every commit. --cov-fail-under is set in [tool.coverage].
        run: uv run pytest -v -p no:randomly --cov=backend/apps --cov-report=xml --cov-report=term
      - name: diff coverage (new lines must be tested)
        # Overall floors (fail_under) let untested new code slide as long as the TOTAL stays
        # above the floor; this gates the PATCH instead. Advisory for now — promote to
        # blocking (drop continue-on-error) after a baseline green run confirms the threshold.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          uv tool run diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=85
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are current (drift gate)
        # Regenerate from the committed backend/schema.yml and fail on any diff.
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: pnpm run lint
      - name: type-coverage (ratchet — floor in package.json typeCoverage.atLeast)
        run: pnpm type-coverage
      - name: dependency-cruiser (architecture contracts — no cycles; api/ must not import UI)
        run: pnpm depcruise
      - name: knip (unused files / exports / types / deps) — advisory, non-blocking
        continue-on-error: true
        run: pnpm knip
      - name: vitest (with coverage)
        run: pnpm run test:cov
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Bare runner (not the Alpine image), so use Playwright's own Chromium —
      # vite.config falls back to it when CHROMIUM_BIN is unset.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Storybook stories (vitest browser lane)
        run: pnpm exec vitest --project storybook run

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8"
      - run: uv python install 3.13
      - run: uv sync --frozen --dev
      - name: pip-audit (backend) — BLOCKING (tree is clean as of 2026-06-04)
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/reqs.txt
          uv tool run pip-audit --strict --requirement /tmp/reqs.txt
      - name: guarddog — malware / typosquat ("slopsquat") scan of PyPI deps — advisory
        # Heuristic (semgrep-based) supply-chain scanner; advisory because heuristics can
        # false-positive. Directly targets AI-hallucinated / squatted package names.
        continue-on-error: true
        run: uv tool run guarddog pypi verify /tmp/reqs.txt
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (frontend) — BLOCKING (tree is clean as of 2026-06-04)
        working-directory: frontend
        run: pnpm audit --audit-level moderate
      - name: guarddog — malware / typosquat scan of npm deps — advisory
        continue-on-error: true
        run: uv tool run guarddog npm verify frontend/package.json
      - name: License inventory (Python) — advisory
        # Surfaces dependency licenses so a copyleft / abandoned dep can't slip in unnoticed.
        # Inventory-only for now; promote to a gate with an allowlist once reviewed.
        run: uv run --with pip-licenses pip-licenses --from=mixed --order=license --summary
      - name: License inventory (frontend) — advisory
        working-directory: frontend
        run: pnpm dlx license-checker --summary --production

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks (scan full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git --redact --config=/repo/.gitleaks.toml /repo

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: hadolint (backend Dockerfile)
        # Config in .hadolint.yaml (ignores DL3008/DL3018 — base image is digest-pinned instead).
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
      - name: hadolint (frontend Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile.dev
      - name: Build images
        run: |
          cp .env.example .env
          python3 -c "import secrets; print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(50))" >> .env
          docker compose build

  trivy:
    # Container OS / OS-library CVE scan of the built web image — the non-redundant value
    # over pip-audit/pnpm-audit (those cover app deps; this covers the base image's OS
    # packages). Advisory (ignore-unfixed + exit-code 0). Skipped on PRs to keep them fast
    # (the web image is a 3-8 min build); runs on push-to-main and manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build web image
        run: docker build -f backend/Dockerfile --target web -t ledger-web:scan .
      - name: Trivy image scan (HIGH/CRITICAL, fixed only) — advisory
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ledger-web:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Trivy config (IaC / Dockerfile / compose misconfig) — advisory
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: SBOM (CycloneDX) from the web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ledger-web:scan
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-web-image
          path: sbom.cdx.json
          retention-days: 30
