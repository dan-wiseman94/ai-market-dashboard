name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (matches compose.yaml `db` + compose.e2e.yaml `db-e2e`):
        # apps.recall's 0001 migration runs VectorExtension() (CREATE EXTENSION
        # vector). On a bare postgres image that aborts the whole test-DB build,
        # cascading to ~800 setup errors. Must ship the `vector` extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ai_dashboard
          POSTGRES_USER: ai_dashboard
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U ai_dashboard"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 10
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-prod
      DJANGO_DEBUG: "1"
      POSTGRES_DB: ai_dashboard
      POSTGRES_USER: ai_dashboard
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
      - name: Provision /data (compose volume substitute on bare runner)
        run: sudo mkdir -p /data && sudo chmod 777 /data
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8"
      - run: uv python install 3.13
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: ty (type-check) — advisory while ty is pre-1.0 / lacks Django ORM modeling
        continue-on-error: true
        run: uv run ty check backend
      - name: pytest (with coverage)
        run: uv run pytest -v --cov=backend/apps --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: vitest (with coverage)
        run: pnpm run test:cov
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Bare runner (not the Alpine image), so use Playwright's own Chromium —
      # vite.config falls back to it when CHROMIUM_BIN is unset.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Storybook stories (vitest browser lane)
        run: pnpm exec vitest --project storybook run

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8"
      - run: uv python install 3.13
      - run: uv sync --frozen --dev
      - name: pip-audit (backend) — advisory, non-blocking
        continue-on-error: true
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/reqs.txt
          uv tool run pip-audit --strict --requirement /tmp/reqs.txt
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (frontend) — advisory, non-blocking
        continue-on-error: true
        working-directory: frontend
        run: pnpm audit --audit-level moderate

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build images
        run: |
          cp .env.example .env
          python3 -c "import secrets; print('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(50))" >> .env
          docker compose build
