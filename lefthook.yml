# Hooks shell into the dev containers. Bring up the stack first with `make dev`.
# To bypass entirely for an emergency commit: `LEFTHOOK=0 git commit ...` or
# skip a single hook with `--no-verify`.

assert_lefthook_installed: true

pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "*.py"
      run: |
        if ! docker compose ps --status running --services | grep -qx web; then
          echo "✗ 'web' container not running — start it with 'make dev' (or set LEFTHOOK=0 to skip)" >&2
          exit 1
        fi
        docker compose exec -T --workdir /app web uv run ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: |
        if ! docker compose ps --status running --services | grep -qx web; then
          echo "✗ 'web' container not running — start it with 'make dev' (or set LEFTHOOK=0 to skip)" >&2
          exit 1
        fi
        docker compose exec -T --workdir /app web uv run ruff format {staged_files}
      stage_fixed: true
    ty:
      glob: "*.py"
      # advisory while ty is pre-1.0 (no Django ORM modeling) — never blocks the commit
      run: |
        if ! docker compose ps --status running --services | grep -qx web; then
          echo "✗ 'web' container not running — start it with 'make dev' (or set LEFTHOOK=0 to skip)" >&2
          exit 1
        fi
        docker compose exec -T --workdir /app web uv run ty check {staged_files} || true
    eslint:
      glob: "frontend/**/*.{ts,tsx}"
      run: |
        if ! docker compose ps --status running --services | grep -qx frontend; then
          echo "✗ 'frontend' container not running — start it with 'make dev' (or set LEFTHOOK=0 to skip)" >&2
          exit 1
        fi
        docker compose exec -T frontend pnpm exec eslint {staged_files}
    gitleaks:
      # Scans the STAGED diff via the gitleaks docker image (no host install needed).
      # Blocks the commit if a secret is detected. `.env` (real secrets) is gitignored;
      # the allowlist covers only templates + fixtures.
      run: docker run --rm -v "$(pwd):/repo" ghcr.io/gitleaks/gitleaks:latest git --staged --redact --config=/repo/.gitleaks.toml /repo

pre-push:
  commands:
    import-contracts:
      run: |
        if ! docker compose ps --status running --services | grep -qx web; then
          echo "✗ 'web' container not running — start it with 'make dev' (or set LEFTHOOK=0 to skip)" >&2
          exit 1
        fi
        docker compose exec -T -w /app web uv run lint-imports
    backend-tests:
      run: |
        if ! docker compose ps --status running --services | grep -qx web; then
          echo "✗ 'web' container not running — start it with 'make dev' (or set LEFTHOOK=0 to skip)" >&2
          exit 1
        fi
        docker compose exec -T --workdir /app web uv run pytest -x backend/
    frontend-tests:
      run: |
        if ! docker compose ps --status running --services | grep -qx frontend; then
          echo "✗ 'frontend' container not running — start it with 'make dev' (or set LEFTHOOK=0 to skip)" >&2
          exit 1
        fi
        docker compose exec -T frontend pnpm test --run
