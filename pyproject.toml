[project]
name = "ai-dashboard"
version = "0.1.0"
description = "AI-powered trading dashboard (single-user, Docker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "channels>=4.1,<4.2",
    "channels-redis>=4.2,<4.3",
    "daphne>=4.1,<4.2",
    "celery[redis]>=5.4,<5.5",
    "django-celery-beat>=2.7,<2.8",
    "redis>=5.0,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "django-environ>=0.11,<0.12",
    "django-cors-headers>=4.4,<5.0",
    "whitenoise>=6.7,<7.0",
    "structlog>=24.4,<25.0",
    "django-structlog>=8.1,<9.0",
    "schwab-py>=1.4,<2.0",
    "cryptography>=43,<44",
    "pandas>=2.2,<3.0",
    "playwright>=1.45,<2.0",
    "drf-nested-routers>=0.94,<1.0",
    "anthropic>=0.72,<1.0",
    "openai>=1.54,<2.0",
    "tiktoken>=0.8,<1.0",
    "croniter>=2.0,<7.0",
    "pandas-market-calendars>=4.4,<5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "fakeredis>=2.24,<3.0",
    "freezegun>=1.5,<2.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "django-stubs[compatible-mypy]>=5.1,<6.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15,<4.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "staticfiles", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers --tb=short -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]
