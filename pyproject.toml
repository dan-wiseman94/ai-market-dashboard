[project]
name = "ai-dashboard"
version = "0.4.0"
description = "AI-powered trading dashboard (single-user, Docker)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Floors at the security-fix versions (2026-06 advisories): django 6.0.6 (PYSEC-2026-197..201),
    # cryptography 46.0.6 (PYSEC-2026-35 / CVE-2024-12797 / CVE-2026-26007). pyjwt (transitive via
    # redis) is bumped to 2.13.0 in the lockfile.
    "django>=6.0.6,<6.1",
    "djangorestframework>=3.17.1,<3.18",
    "channels>=4.3.2,<5.0",
    "channels-redis>=4.3.0,<5.0",
    "uvicorn[standard]>=0.32,<1.0",
    "celery[redis]>=5.6.3,<5.7",
    "django-celery-beat>=2.9.0,<3.0",
    # celery 5.6.x (via kombu[redis]) caps redis at <6.5; redis-py 7.x is unsatisfiable here.
    "redis>=5.0,<6.5",
    "psycopg[binary]>=3.3.4,<4.0",
    "django-environ>=0.13.0,<0.14",
    "django-cors-headers>=4.9.0,<5.0",
    "whitenoise>=6.7,<7.0",
    "structlog>=25.5.0,<26.0",
    "django-structlog>=10.0.0,<11.0",
    "schwab-py>=1.4,<2.0",
    "cryptography>=46.0.6,<50",
    "pandas>=2.2,<3.0",
    "playwright>=1.59.0,<2.0",
    "drf-nested-routers>=0.94,<1.0",
    "anthropic>=0.104.1,<1.0",
    "openai>=2.38.0,<3.0",
    "tiktoken>=0.13.0,<1.0",
    "croniter>=2.0,<7.0",
    "pandas-market-calendars>=4.4,<5.0",
    "pgvector>=0.3,<1.0",
    "fastembed>=0.4,<1.0",
    "drf-spectacular>=0.28,<1.0",
    "sentry-sdk[django,celery]>=2.0,<3.0",
    # Imported directly by app code but previously only present transitively (surfaced by
    # deptry DEP003). Declared explicitly so a transitive provider dropping one can't silently
    # break the app — all already resolved in uv.lock, so this is a no-op at install time.
    "requests>=2.32,<3.0",   # apps/market/services/*, apps/secrets/*
    "pydantic>=2.9,<3.0",    # apps/{observer,regime,thesis,warroom}/schemas + personas/verdict
    "numpy>=1.26,<3.0",      # apps/recall/embeddings (vector math)
    "httpx>=0.27,<1.0",      # apps/secrets/schwab_oauth
    "asgiref>=3.8,<4.0",     # async_to_sync / sync_to_async in threads/secrets/snapshots
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-django>=4.12.0,<5.0",
    "pytest-asyncio>=1.3.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "pytest-xdist>=3.8.0,<4.0",
    "pytest-randomly>=3.15,<4.0",
    "pytest-timeout>=2.3,<3.0",
    "hypothesis>=6.100,<7.0",
    "pytest-playwright>=0.8.0,<1.0",
    "axe-playwright-python>=0.1.7,<1.0",
    "fakeredis>=2.35.1,<3.0",
    "freezegun>=1.5.5,<2.0",
    "pyyaml>=6.0.3,<7.0",
    "ruff>=0.15.14,<1.0",
    "ty>=0.0.4",
    "import-linter>=2.0,<3.0",
    "mypy>=1.15,<2.0",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "mypy-baseline>=0.7,<1.0",
    "schemathesis>=3.39,<5.0",
    "mutmut>=3.0,<4.0",
    "daphne>=4.2.1,<5.0",
    # Quality tooling (see CLAUDE.md "Quality gates"):
    "deptry>=0.20,<1.0",   # dependency hygiene: unused / missing / transitively-used deps
    "vulture>=2.11,<3.0",  # dead-code detection (functions/classes ruff's F-rules miss)
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"
# vulture_whitelist.py is intentionally a list of bare "undefined" names (that's how vulture
# whitelists work) — exclude it so ruff doesn't F821 on it.
extend-exclude = ["migrations", ".venv", "staticfiles", "frontend", "tools/vulture_whitelist.py"]

[tool.ruff.lint]
# C901 = cyclomatic complexity (mccabe), ceiling below. The historical offenders were
# decomposed UNDER the ceiling (not grandfathered), so the gate is clean — new code must
# come in at <= the ceiling.
# (PLR0912/PLR0913/PLR0915 intentionally held — 22+ framework-driven sites would need
#  grandfathering; enable later once those are paid down.)
select = ["E", "F", "I", "B", "UP", "SIM", "DJ", "RUF", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# Ceiling = 15. Every in-tree function classifies under it (the former 27-complexity
# validate_condition / build_snapshot were split into helpers); new code must too.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/settings/*.py" = ["F403", "F405"]
"**/migrations/**" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
exclude = ["**/migrations/**", ".venv", "staticfiles", "**/.mypy_cache/**"]

[tool.ty.rules]
unresolved-attribute = "warn"
invalid-attribute-override = "warn"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "backend"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
# Run as: `mypy backend/apps backend/config` from the repo root (or /app in the container).
exclude = ['/migrations/', '/tests/']

[tool.django-stubs]
django_settings_module = "config.settings.dev"
# This project resolves settings dynamically via django-environ (env(...)) + runtime_config();
# strict_settings would flag those legitimate dynamic accesses.
strict_settings = false

[tool.importlinter]
root_package = "apps"
# Run from backend/ (the container WORKDIR), where `apps` is the top-level package.
# Contracts encode CLAUDE.md landmines as executable invariants. Both are TRUE as of
# 2026-06-03 (verified by grep) — they prevent regressions, not fix current ones.

[[tool.importlinter.contracts]]
name = "Concrete AI providers are private to apps.ai (use get_provider / router)"
type = "forbidden"
# The package re-export `from apps.ai.providers import get_provider`, the `base`
# Provider protocol, and `claude_structured.run_structured` are the PUBLIC surface.
# Instantiating a concrete impl elsewhere is the landmine.
source_modules = [
    "apps.threads",
    "apps.observer",
    "apps.triggers",
    "apps.secrets",
    "apps.thesis",
    "apps.analytics",
    "apps.strategy",
    "apps.book",
    "apps.regime",
    "apps.briefing",
    "apps.predictions",
    "apps.snapshots",
    "apps.market",
]
forbidden_modules = [
    "apps.ai.providers.claude",
    "apps.ai.providers.openai",
    "apps.ai.providers.local",
]
# Forbid only DIRECT imports — the public path (apps.ai.providers.get_provider,
# whose package __init__ pulls in the concrete impls) is legitimate.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Low-level crypto stays inside apps.secrets (reads go via credentials.decrypt_token)"
type = "forbidden"
# `cryptography.fernet.InvalidToken` is imported widely just to CATCH it — that's
# fine. What must stay private is the key derivation + EncryptedJSONField.
source_modules = [
    "apps.threads",
    "apps.observer",
    "apps.triggers",
    "apps.market",
    "apps.thesis",
    "apps.analytics",
    "apps.strategy",
    "apps.ai",
    "apps.snapshots",
    "apps.briefing",
]
forbidden_modules = [
    "apps.secrets.fields",
    "apps.secrets.keys",
]
# Forbid only DIRECT imports — importing apps.secrets.models (the public API) is
# fine even though it transitively pulls in fields/keys inside apps.secrets.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Fungible market-data providers are private to apps.market (route via services.fallback)"
type = "forbidden"
# alpaca / tiingo / twelvedata / polygon / tradier / marketaux are interchangeable
# quote/OHLC/chain/news vendors selected at runtime by apps.market.services.fallback.
# Other apps must depend on that seam (or the market.* public reads), never a concrete
# vendor — otherwise swapping or adding a provider means editing every call site.
# Deliberately NOT listed: edgar / fred / treasury — those are distinct data domains
# (SEC filings / macro / yield curve), not fungible quote sources, and are imported
# directly by the snapshot & regime section fetchers by design.
source_modules = [
    "apps.ai",
    "apps.analytics",
    "apps.strategy",
    "apps.backups",
    "apps.book",
    "apps.briefing",
    "apps.core",
    "apps.export",
    "apps.observer",
    "apps.predictions",
    "apps.profiles",
    "apps.recall",
    "apps.regime",
    "apps.secrets",
    "apps.snapshots",
    "apps.thesis",
    "apps.threads",
    "apps.triggers",
]
forbidden_modules = [
    "apps.market.services.alpaca",
    "apps.market.services.tiingo",
    "apps.market.services.twelvedata",
    "apps.market.services.polygon",
    "apps.market.services.tradier",
    "apps.market.services.marketaux",
]
# Forbid only DIRECT imports — using the fallback seam (which pulls a vendor in
# lazily inside apps.market) is legitimate.
allow_indirect_imports = true

# Mutation testing (mutmut) — NIGHTLY only (slow), never a PR gate. Scoped to the highest-stakes
# "money" paths where a surviving mutant means a real test gap.
#
# Config intentionally lives in backend/setup.cfg, NOT here: mutmut derives a mutant's module
# name from its file path and reads config only from its CWD, so it must run from backend/
# (the source root) for path-derived names (apps.ai.cost) to match the runtime import names
# its coverage stats record. Run from the repo root with backend/apps/... paths, every mutant
# was named backend.apps.* and silently reported "no tests" — mutation testing was a no-op.
# See backend/setup.cfg, `make mutate`, and .github/workflows/mutation.yml.

[tool.deptry]
# Dependency hygiene. Run as `uv run deptry backend` (deps installed, so import→distribution
# mapping works — `uvx deptry` is noisy because it can't see metadata). Scoped to SHIPPED code:
# tests/migrations/conftest are excluded so dev-only imports (pytest, hypothesis) aren't DEP004'd.
known_first_party = ["apps", "config"]
extend_exclude = [".*/migrations/.*", ".*/tests/.*", ".*/conftest\\.py"]

[tool.deptry.per_rule_ignores]
# DEP002 = "declared but never imported". These are framework plugins wired by STRING in
# Django settings (INSTALLED_APPS / MIDDLEWARE / CHANNEL_LAYERS / DB engine), not imported —
# deptry can't see that usage. They are genuinely required; ignore the false "unused".
DEP002 = [
    "channels-redis",       # CHANNEL_LAYERS backend string
    "django-celery-beat",   # INSTALLED_APPS
    "django-cors-headers",  # INSTALLED_APPS + MIDDLEWARE
    "django-structlog",     # INSTALLED_APPS + MIDDLEWARE
    "psycopg",              # DATABASES engine (Django imports it)
    "whitenoise",           # MIDDLEWARE string
    "uvicorn",              # ASGI server entrypoint
    "daphne",               # ASGI server entrypoint
    "sentry-sdk",           # initialised via DSN; opt-in import guarded
    "pandas",               # consumed via pandas-market-calendars; pinned for DataFrame return types
]

[tool.vulture]
# Dead-code detection. Scoped to shipped code (tests use side-effecting pytest fixtures that
# read as "unused vars"; migrations carry Django's unused `schema_editor` signature). Advisory:
# vulture has irreducible false positives, so it informs rather than gates. Drive findings to
# zero via tools/vulture_whitelist.py (names that are framework-required but look unused).
paths = ["backend/apps", "backend/config", "tools/vulture_whitelist.py"]
exclude = ["*/migrations/*", "*/tests/*", "*/conftest.py"]
min_confidence = 80
ignore_names = ["schema_editor", "apps"]
ignore_decorators = ["@shared_task", "@receiver", "@app.task", "@register.filter", "@register.simple_tag"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "*/conftest.py"]
# Branch coverage: also require the else/short-circuit paths to be exercised, not just
# every line. This codebase leans heavily on "degrade silently to None/{}/skip" branches
# (decrypt_token, _safe defaults, postmortem/coverage best-effort) — branch coverage turns
# those documented silent-failure paths into measured ones. (Line-only was 89.85%.)
branch = true

[tool.coverage.report]
# Gate: fail if total coverage drops below the floor. Measured 88.37% on 2026-06-06 with
# BRANCH coverage on (line-only was 90.14%; branch counts the else/short-circuit paths too —
# app code only, tests/migrations omitted). Floor set ~2% under, to ratchet up over time.
# Active whenever --cov runs from the repo root (CI), where this config is found.
fail_under = 86

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["backend"]
# `mutants` is mutmut's generated working copy (backend/mutants/, gitignored). It now lives under
# the pytest tree, so exclude it or a stray `make mutate` run breaks every later `pytest` collection.
# The rest mirror pytest's built-in defaults (replacing norecursedirs drops them otherwise).
norecursedirs = ["mutants", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
addopts = "-ra --strict-markers --tb=short -m 'not integration' --timeout=60"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
    "e2e: marks tests as end-to-end browser journeys (require compose stack + MOCK_EXTERNAL)",
]
