[project]
name = "ai-dashboard"
version = "0.1.0"
description = "AI-powered trading dashboard (single-user, Docker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "channels>=4.1,<4.2",
    "channels-redis>=4.2,<4.3",
    "daphne>=4.1,<4.2",
    "celery[redis]>=5.4,<5.5",
    "django-celery-beat>=2.7,<2.8",
    "redis>=5.0,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "django-environ>=0.11,<0.12",
    "django-cors-headers>=4.4,<5.0",
    "whitenoise>=6.7,<7.0",
    "structlog>=24.4,<25.0",
    "django-structlog>=8.1,<9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "fakeredis>=2.24,<3.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "django-stubs[compatible-mypy]>=5.1,<6.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15,<4.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
