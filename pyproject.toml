[project]
name = "ai-dashboard"
version = "0.1.0"
description = "AI-powered trading dashboard (single-user, Docker)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.0.5,<6.1",
    "djangorestframework>=3.17.1,<3.18",
    "channels>=4.3.2,<5.0",
    "channels-redis>=4.3.0,<5.0",
    "uvicorn[standard]>=0.32,<1.0",
    "celery[redis]>=5.6.3,<5.7",
    "django-celery-beat>=2.9.0,<3.0",
    # celery 5.6.x (via kombu[redis]) caps redis at <6.5; redis-py 7.x is unsatisfiable here.
    "redis>=5.0,<6.5",
    "psycopg[binary]>=3.3.4,<4.0",
    "django-environ>=0.13.0,<0.14",
    "django-cors-headers>=4.9.0,<5.0",
    "whitenoise>=6.7,<7.0",
    "structlog>=25.5.0,<26.0",
    "django-structlog>=10.0.0,<11.0",
    "schwab-py>=1.4,<2.0",
    "cryptography>=43,<50",
    "pandas>=2.2,<3.0",
    "playwright>=1.59.0,<2.0",
    "drf-nested-routers>=0.94,<1.0",
    "anthropic>=0.104.1,<1.0",
    "openai>=2.38.0,<3.0",
    "tiktoken>=0.13.0,<1.0",
    "croniter>=2.0,<7.0",
    "pandas-market-calendars>=4.4,<5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-django>=4.12.0,<5.0",
    "pytest-asyncio>=1.3.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "pytest-xdist>=3.8.0,<4.0",
    "pytest-playwright>=0.8.0,<1.0",
    "axe-playwright-python>=0.1.7,<1.0",
    "fakeredis>=2.35.1,<3.0",
    "freezegun>=1.5.5,<2.0",
    "pyyaml>=6.0.3,<7.0",
    "ruff>=0.15.14,<1.0",
    "ty>=0.0.1a0",
    "daphne>=4.2.1,<5.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations", ".venv", "staticfiles", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
exclude = ["**/migrations/**", ".venv", "staticfiles", "**/.mypy_cache/**"]

[tool.ty.rules]
unresolved-attribute = "warn"
invalid-attribute-override = "warn"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers --tb=short -m 'not integration'"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
    "e2e: marks tests as end-to-end browser journeys (require compose stack + MOCK_EXTERNAL)",
]
