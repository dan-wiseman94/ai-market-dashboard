openapi: 3.0.3
info:
  title: Ledger API
  version: 0.4.0
  description: Single-user AI trading dashboard — internal API.
paths:
  /api/aieval/runs/:
    get:
      operationId: aieval_runs_list
      description: 'GET: the 50 newest runs. POST: queue one bounded, billed eval
        run on a provider.'
      tags:
      - aieval
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvalRun'
          description: ''
    post:
      operationId: aieval_runs_create
      description: 'GET: the 50 newest runs. POST: queue one bounded, billed eval
        run on a provider.'
      tags:
      - aieval
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalRunRequest'
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunQueued'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunError'
          description: ''
  /api/aieval/runs/latest/:
    get:
      operationId: aieval_runs_latest_retrieve
      tags:
      - aieval
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/analytics/ai-calibration/:
    get:
      operationId: analytics_ai_calibration_retrieve
      description: Live calibration of the AI's own resolved predictions.
      tags:
