      description: |-
        GET /api/errors/ — list recent ErrorEvents newest-first.

        Query params:
          ?unresolved=true   — filter to unresolved only
          ?limit=N           — cap result count (default 50, max 200)
      tags:
      - errors
      security:
      - {}
