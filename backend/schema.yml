          maxLength: 100
        input_tokens:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        output_tokens:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        cached_tokens:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        cost_usd:
          type: string
