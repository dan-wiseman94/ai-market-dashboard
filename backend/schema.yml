  /api/predictions/:
    get:
      operationId: predictions_list
      description: |-
        Browse the ledger: ``?ticker=``, ``?status=`` (open/resolving/resolved/
        invalidated), ``?horizon=`` (days). Newest call first. An unknown status or a
        non-numeric horizon is ignored rather than 400ing — these are URL-driven UI
        filters, not a contract.
      parameters:
      - in: query
        name: horizon
        schema:
          type: integer
        description: Horizon in days (matches horizon_days). A non-numeric value is
          ignored.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - invalidated
          - open
          - resolved
          - resolving
        description: Ledger status. An unrecognized value is ignored, not rejected.
      - in: query
        name: ticker
        schema:
          type: string
        description: Exact ticker, case-insensitive. Ignored when blank.
      tags:
      - predictions
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIPredictionList'
          description: ''
