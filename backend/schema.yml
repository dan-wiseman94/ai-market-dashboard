      enum:
      - trigger
      - observer_done
      - error
      - cost_limit
      - backup
      - postmortem
      - briefing
      - regime
      - book
      - desk
      type: string
      description: |-
        * `trigger` - Trigger
        * `observer_done` - Observer fired
        * `error` - Error
        * `cost_limit` - Cost limit
        * `backup` - Backup
        * `postmortem` - Post-mortem
        * `briefing` - Briefing
        * `regime` - Regime
        * `book` - Book
        * `desk` - Desk
    ObserverSchedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        profile:
          type: integer
        enabled:
          type: boolean
        market_hours_only:
          type: boolean
        objective_template:
          type: string
        override_provider:
          type: string
          maxLength: 32
        override_model:
          type: string
          maxLength: 100
        default_includes: {}
        default_watchlist_tickers: {}
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          description: |-
            diff: feed AI only the delta vs the last ready snapshot.

            * `full` - Full payload
            * `diff` - Diff vs previous capture
        structured:
          type: boolean
          description: When True, observer runs use messages.parse with the ObservationReport
            schema instead of streaming text.
        use_batch:
          type: boolean
          description: When True, fires submit a Messages Batch per watchlist ticker
            instead of streaming. 50% cheaper; not interactive.
        consensus:
          type: boolean
          description: When True (with structured), fan the ObservationReport across
            every structured-capable provider and record a cross-model agreement signal
            instead of a single structured report. ~Nx cost; opt-in only.
        investigate:
          type: boolean
          description: When True (plain mode only), the fire runs a bounded tool-using
            investigation instead of a single observation.
        last_batch_id:
          type: string
          readOnly: true
        last_fired_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        fire_mode:
          $ref: '#/components/schemas/FireModeEnum'
        close_offset_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Minutes before the actual session close to fire (relative_to_close).
        cron:
          type: string
          writeOnly: true
        cron_display:
          type: string
          readOnly: true
      required:
      - created_at
      - cron_display
      - id
      - last_batch_id
      - last_fired_at
      - name
      - profile
      - updated_at
