    get:
      operationId: backups_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - backups
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBackupRecordList'
          description: ''
    post:
      operationId: backups_create
      tags:
      - backups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupRecord'
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRecord'
          description: ''
  /api/backups/{id}/:
    get:
      operationId: backups_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this backup record.
        required: true
      tags:
      - backups
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRecord'
          description: ''
    delete:
      operationId: backups_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this backup record.
        required: true
      tags:
      - backups
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/backups/{id}/download/:
    get:
      operationId: backups_download_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this backup record.
        required: true
      tags:
      - backups
      security:
      - {}
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '404':
          description: No response body
  /api/backups/{id}/restore/:
    post:
      operationId: backups_restore_create
      description: |-
        Restore the database from this backup, replacing its entire contents.

        Requires `{"confirm": "<exact backup filename>"}` in the body.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this backup record.
        required: true
      tags:
      - backups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreError'
          description: ''
        '504':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreError'
          description: ''
  /api/backups/run/:
    post:
      operationId: backups_run_create
      tags:
