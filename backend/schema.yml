components:
  schemas:
    AIPrediction:
      type: object
      description: |-
        One ledger row, read-only: predictions are written by the extractor and
        scored by the resolver, never by a client.
      properties:
        id:
          type: integer
          readOnly: true
        ticker:
          type: string
          readOnly: true
        direction:
          allOf:
          - $ref: '#/components/schemas/DirectionalCallEnum'
          readOnly: true
        horizon_days:
          type: integer
          readOnly: true
        confidence:
          type: number
          format: double
          readOnly: true
        expected_move_pct:
          type: number
          format: double
          readOnly: true
          nullable: true
        rationale:
          type: string
          readOnly: true
        invalidation_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          readOnly: true
          nullable: true
        invalidation_note:
          type: string
          readOnly: true
        provider:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AIPredictionStatusEnum'
          readOnly: true
        predicted_at:
          type: string
          format: date-time
          readOnly: true
        resolve_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        invalidated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        forward_return_pct:
          type: number
          format: double
          readOnly: true
          nullable: true
        verdict:
          allOf:
          - $ref: '#/components/schemas/VerdictEnum'
          readOnly: true
        source_message_id:
          type: integer
          readOnly: true
          nullable: true
        source_snapshot_id:
          type: integer
          readOnly: true
          nullable: true
        profile_id:
          type: integer
          readOnly: true
          nullable: true
        profile_name:
          type: string
          readOnly: true
          default: ''
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - confidence
      - created_at
      - direction
      - expected_move_pct
      - forward_return_pct
      - horizon_days
      - id
      - invalidated_at
      - invalidation_note
      - invalidation_price
      - model
      - predicted_at
      - profile_id
      - profile_name
      - provider
      - rationale
      - resolve_at
      - resolved_at
      - source_message_id
      - source_snapshot_id
      - status
      - ticker
      - updated_at
      - verdict
    AIPredictionStatusEnum:
      enum:
      - open
      - resolving
      - resolved
      - invalidated
      type: string
      description: |-
        * `open` - open
        * `resolving` - resolving
        * `resolved` - resolved
        * `invalidated` - invalidated
    AIRun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          type: string
          maxLength: 32
        model:
          type: string
          maxLength: 100
        input_tokens:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        output_tokens:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        cached_tokens:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        cost_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,6})?$
        latency_ms:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        status:
          $ref: '#/components/schemas/AIRunStatusEnum'
        error:
          type: string
      required:
      - id
      - model
      - provider
    AIRunStatusEnum:
      enum:
      - pending
      - streaming
      - done
      - failed
      - cost_capped
      type: string
      description: |-
        * `pending` - Pending
        * `streaming` - Streaming
        * `done` - Done
        * `failed` - Failed
        * `cost_capped` - Cost capped
    AgentPreset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          default: ''
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          maxLength: 300
        objective_template:
          type: string
        structured:
          type: boolean
        builtin:
          type: boolean
          readOnly: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - builtin
      - created_at
      - id
      - name
      - objective_template
      - updated_at
    BackfillQueued:
      type: object
      description: 202 body of POST /api/recall/backfill/.
      properties:
        task_id:
          type: string
        status:
          type: string
          description: Always "queued".
      required:
      - status
      - task_id
    BackupRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        filename:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ManualOrScheduledEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BackupRecordStatusEnum'
          readOnly: true
        error:
          type: string
          readOnly: true
      required:
      - created_at
      - error
      - filename
      - id
      - kind
      - sha256
      - size_bytes
      - status
    BackupRecordStatusEnum:
      enum:
      - ok
      - failed
      - rotated
      - deleted
      - missing
      type: string
      description: |-
        * `ok` - OK
        * `failed` - Failed
        * `rotated` - Rotated
        * `deleted` - Deleted
        * `missing` - Missing
    BlankEnum:
      enum:
      - ''
    BookSnapshot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        as_of_date:
          type: string
          format: date
          readOnly: true
        exposures:
          readOnly: true
        concentration:
          readOnly: true
        clusters:
          readOnly: true
        regime_fit:
          readOnly: true
        near_invalidation:
          readOnly: true
        narrative:
          type: string
          readOnly: true
        var_beta:
          readOnly: true
      required:
      - as_of_date
      - clusters
      - concentration
      - created_at
      - exposures
      - id
      - narrative
      - near_invalidation
      - regime_fit
      - var_beta
    BookSnapshotTrend:
      type: object
      description: |-
        One point on the book's history curve.

        The detail serializer's per-position arrays (exposures, clusters, VaR
        positions) are what make a row heavy and none of them plot, so this flattens
        the scalars a trend/sparkline reads and leaves the arrays to
        ``GET /api/book/<id>/``. Every metric is nullable: a day with no priceable
        position has no VaR, and plotting a zero there would invent a reading.
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        as_of_date:
          type: string
          format: date
          readOnly: true
        hhi:
          type: number
          format: double
          readOnly: true
          nullable: true
        top_n_share:
          type: number
          format: double
          readOnly: true
          nullable: true
        total_abs:
          type: number
          format: double
          readOnly: true
          nullable: true
        net_long:
          type: number
          format: double
          readOnly: true
          nullable: true
        net_short:
          type: number
          format: double
          readOnly: true
          nullable: true
        gross_dollar:
          type: number
          format: double
          readOnly: true
          nullable: true
        net_dollar:
          type: number
          format: double
          readOnly: true
          nullable: true
        diversified_var_usd:
          type: number
          format: double
          readOnly: true
          nullable: true
        undiversified_var_usd:
          type: number
          format: double
          readOnly: true
          nullable: true
        beta_adjusted_net_exposure_usd:
          type: number
          format: double
          readOnly: true
          nullable: true
        regime:
          type: string
          readOnly: true
          nullable: true
        alignment:
          type: string
          readOnly: true
          nullable: true
        position_count:
          type: integer
          readOnly: true
        cluster_count:
          type: integer
          readOnly: true
        near_invalidation_count:
          type: integer
          readOnly: true
      required:
      - alignment
      - as_of_date
      - beta_adjusted_net_exposure_usd
      - cluster_count
      - created_at
      - diversified_var_usd
      - gross_dollar
      - hhi
      - id
      - near_invalidation_count
      - net_dollar
      - net_long
      - net_short
      - position_count
      - regime
      - top_n_share
      - total_abs
      - undiversified_var_usd
    BriefingConfig:
      type: object
      properties:
        enabled:
          type: boolean
          description: When True, observer.briefing_run_scheduled assembles and posts
            one briefing per local day once send_at_local has passed.
        synthesis_enabled:
          type: boolean
          description: When True, a ready briefing also pays for one AI synthesis
            pass over the assembled data. When False the deterministic sections still
            render; only the AI call is skipped.
        send_at_local:
          type: string
          format: time
        profile:
          type: integer
          nullable: true
        news_lookback_hours:
          type: integer
          maximum: 2147483647
          minimum: 0
        events_within_days:
          type: integer
          maximum: 2147483647
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - updated_at
    BriefingRun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/BriefingRunStatusEnum'
        data: {}
        snapshot:
          type: integer
          nullable: true
        scheduled_date:
          type: string
          format: date
          nullable: true
        synthesis_text:
          type: string
          readOnly: true
        synthesis_status:
          type: string
          readOnly: true
      required:
      - created_at
      - id
      - synthesis_status
      - synthesis_text
    BriefingRunStatusEnum:
      enum:
      - assembling
      - ready
      - failed
      type: string
      description: |-
        * `assembling` - Assembling
        * `ready` - Ready
        * `failed` - Failed
    CalendarOverride:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ticker:
          type: string
          maxLength: 16
        market_key:
          $ref: '#/components/schemas/MarketKeyEnum'
        note:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - market_key
      - ticker
      - updated_at
    Choice:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required:
