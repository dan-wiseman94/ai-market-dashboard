  /api/coverage/:
    get:
      operationId: coverage_list
      description: Read the per-ticker house views; trigger a manual revision.
      tags:
      - coverage
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoverageNoteList'
          description: ''
  /api/coverage/{ticker}/:
    get:
      operationId: coverage_retrieve
      description: |-
        The note for a ticker, or 204 when nothing has opened coverage there yet.

        An uncovered ticker is the ordinary case, not an error: the market page
        renders a house-view strip for every symbol and most have no note. A 404
        would put a console error on each of those page loads, which both drowns
        real failures and fails the e2e console guard. 204 is the shape the API
        client already coalesces to null for the other "latest, maybe absent"
        reads.
      parameters:
      - in: path
        name: ticker
        schema:
          type: string
        required: true
      tags:
      - coverage
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageNoteDetail'
          description: ''
        '204':
          description: No response body
  /api/coverage/{ticker}/revise/:
    post:
      operationId: coverage_revise_create
      description: Read the per-ticker house views; trigger a manual revision.
      parameters:
      - in: path
        name: ticker
        schema:
          type: string
        required: true
      tags:
      - coverage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageNote'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageNote'
          description: ''
