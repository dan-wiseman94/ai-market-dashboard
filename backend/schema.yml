    PerObjectFeature:
      type: object
      description: |-
        A setting that lives on individual rows, never globally.

        The page renders a rollup and a deep link rather than a switch: a disabled switch
        reports ``aria-checked="false"``, which states "this is off" — factually wrong when
        four of thirteen profiles have it on.

        ``on``/``total`` are nullable and paired with ``degraded``. A failed aggregate must
        not fall back to ``0 of 0``: that renders as a confident lie the user would act on.
        ``on`` is also null for non-boolean fields, where "how many are on" is meaningless.
      properties:
        key:
          type: string
        label:
          type: string
        summary:
          type: string
        help:
          type: string
        group:
          type: string
        order:
          type: integer
        scope:
          type: string
        backing:
          type: string
        value_type:
          type: string
        editable:
          type: boolean
        write_path:
          type: string
        field:
          type: string
        env_var:
          type: string
        env_only_reason:
          type: string
        costs_money:
          type: boolean
        cost_note:
          type: string
        retroactive:
          type: boolean
        requires:
          type: array
          items:
            type: string
        requirement:
          allOf:
          - $ref: '#/components/schemas/Requirement'
          nullable: true
        provider_only:
          type: string
        deep_link:
          type: string
        'on':
          type: integer
          nullable: true
        total:
          type: integer
          nullable: true
        degraded:
          type: boolean
        noun:
          type: string
      required:
      - backing
      - cost_note
      - costs_money
      - deep_link
      - degraded
      - editable
      - env_only_reason
      - env_var
      - field
      - group
      - help
      - key
      - label
      - noun
      - 'on'
      - order
      - provider_only
      - requirement
      - requires
      - retroactive
      - scope
      - summary
      - total
      - value_type
      - write_path
