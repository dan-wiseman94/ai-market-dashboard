        guard_trigger_id:
          type: string
          readOnly: true
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        close_note:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        postmortems:
          type: array
          items:
            $ref: '#/components/schemas/PostMortem'
          readOnly: true
      required:
      - closed_at
      - created_at
      - direction
      - guard_trigger_id
      - id
      - postmortems
      - profile_id
      - review_thread_id
      - snapshot_id
      - status
      - thread_id
      - ticker
      - title
      - updated_at
    ThesisDirectionEnum:
      enum:
      - bullish
      - bearish
      - neutral
      type: string
      description: |-
        * `bullish` - Bullish
        * `bearish` - Bearish
        * `neutral` - Neutral
    ThesisStatusEnum:
      enum:
      - open
      - closed_win
      - closed_loss
      - closed_scratch
      - invalidated
      type: string
      description: |-
        * `open` - Open
        * `closed_win` - Closed — Win
        * `closed_loss` - Closed — Loss
        * `closed_scratch` - Closed — Scratch
        * `invalidated` - Invalidated
    Thread:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ThreadKindEnum'
          readOnly: true
        title:
          type: string
          maxLength: 200
        profile:
          allOf:
          - $ref: '#/components/schemas/ProfileInline'
          readOnly: true
        pinned_snapshot_id:
          type: integer
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - messages
      - pinned_snapshot_id
      - profile
    ThreadKindEnum:
      enum:
      - consult
      - chat
      - observer
      - briefing
      - diff
      - warroom
      type: string
      description: |-
        * `consult` - One-shot consult
        * `chat` - Ongoing chat
        * `observer` - Observer timeline
        * `briefing` - Morning briefing
        * `diff` - Diff
        * `warroom` - War Room
    ThreadList:
      type: object
      description: |-
        Light row for the list endpoint — deliberately omits ``messages``.

        ``Message.content`` holds serialized snapshots + full AI responses (tens of KB
        each, up to ~150k-token synthetic snapshot turns), so nesting every thread's
        full history made GET /api/threads/ the heaviest list endpoint in the app while
        the list UI reads only title/kind/profile/created_at. The full ThreadSerializer
        is still used for the detail view. ``message_count`` comes from a queryset
        annotation. Mirrors SnapshotListSerializer.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/ThreadKindEnum'
        title:
          type: string
          maxLength: 200
        profile:
          allOf:
          - $ref: '#/components/schemas/ProfileInline'
          readOnly: true
        pinned_snapshot_id:
          type: integer
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        message_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - message_count
      - pinned_snapshot_id
      - profile
    TradingProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        style:
          type: string
          description: The trading style text. Prepended as system prompt.
        default_includes: {}
        default_provider:
          type: string
          maxLength: 32
        default_model:
          type: string
          maxLength: 100
        enable_tools:
          type: boolean
          description: Expose the default Toolset (get_quote, fetch_ohlc, search_news,
            get_option_chain, compute_indicator) to Claude.
        enable_thinking:
          type: boolean
          description: Turn on extended thinking on Claude.
        thinking_budget:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Thinking token budget when enable_thinking=True. Billed as
            output.
        enable_memory:
          type: boolean
          description: Expose the Memory tool with a per-profile namespace under /data/memory/<profile_id>/.
        enable_coach:
          type: boolean
          description: Inject the Decision Coach context (prior theses, diff-vs-last
            snapshot, per-ticker track record, recall) plus a base observational system
            prompt. Off = legacy behavior (system prompt is just the style).
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - style
      - updated_at
    UserFile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        anthropic_id:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/UserFileKindEnum'
        ticker:
          type: string
          maxLength: 16
        mime:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        filename:
          type: string
          maxLength: 200
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - anthropic_id
      - id
      - mime
      - size
      - uploaded_at
    UserFileKindEnum:
      enum:
      - filing
      - transcript
      - ohlc_csv
      - research
      - other
      type: string
      description: |-
        * `filing` - SEC filing
        * `transcript` - Earnings transcript
        * `ohlc_csv` - Historical OHLC CSV
        * `research` - Research PDF
        * `other` - Other
    VerdictEnum:
      enum:
      - correct
      - incorrect
      - mixed
      - inconclusive
      type: string
      description: |-
        * `correct` - Correct
        * `incorrect` - Incorrect
        * `mixed` - Mixed
        * `inconclusive` - Inconclusive
    WarRoomRun:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        subject_kind:
          type: string
          readOnly: true
        subject_label:
          type: string
          readOnly: true
        params:
          readOnly: true
        verdict:
          readOnly: true
        confidence:
          type: number
          format: double
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/WarRoomRunStatusEnum'
          readOnly: true
        error:
          type: string
          readOnly: true
        thread_id:
          type: integer
          readOnly: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - confidence
      - created_at
      - error
      - id
      - messages
      - params
      - status
      - subject_kind
      - subject_label
      - thread_id
      - verdict
    WarRoomRunStatusEnum:
      enum:
      - running
      - done
      - error
      type: string
      description: |-
        * `running` - Running
        * `done` - Done
        * `error` - Error
    Watchlist:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistSymbol'
          readOnly: true
      required:
      - created_at
