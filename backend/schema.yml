    Requirement:
      type: object
      description: |-
        An external precondition (today: a connected data source).

        ``satisfied`` is nullable on purpose: the probe touches Redis and the provider
        health marker, so a failure degrades to "unknown" rather than claiming "not
        connected" and inviting the user to re-authorise something that is fine.
      properties:
        id:
          type: string
        label:
          type: string
        satisfied:
          type: boolean
          nullable: true
        manage_path:
          type: string
      required:
      - id
      - label
      - manage_path
      - satisfied
    RestoreError:
      type: object
      description: |-
        The restore endpoint's refusal envelope. ``code`` is the machine-readable
        reason; the optional keys are present only for the codes that carry them.
      properties:
        code:
          type: string
        detail:
          type: string
        expected:
          type: string
          description: 'confirmation_mismatch only: the filename the client had to
            type.'
        exit_code:
          type: integer
          description: 'restore_failed only: pg_restore''s exit status.'
        stderr:
          type: string
          description: 'restore_failed only: the last 4000 bytes of credential-scrubbed
            pg_restore stderr.'
      required:
      - code
      - detail
    RestoreRequest:
      type: object
      description: |-
        Body of ``POST /api/backups/{id}/restore/``.

        The confirmation is a deliberate-action guard, not a secret: it must equal the
        backup's own ``filename``, which the list endpoint already hands out.
      properties:
        confirm:
          type: string
          description: The backup's exact filename. Anything else answers 400.
      required:
      - confirm
    RestoreResponse:
      type: object
      description: |-
        A completed restore. ``workers_quiesced`` is always false — this endpoint
        cannot stop worker/beat (no Docker socket in the container), so ``warning``
        says to restart them.
      properties:
        restored:
          type: boolean
        backup_id:
          type: integer
        filename:
          type: string
        duration_ms:
          type: integer
        workers_quiesced:
          type: boolean
        warning:
          type: string
      required:
      - backup_id
      - duration_ms
      - filename
      - restored
      - warning
      - workers_quiesced
