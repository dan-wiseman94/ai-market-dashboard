      - value
    CoverageNote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ticker:
          type: string
          maxLength: 16
        stance:
          $ref: '#/components/schemas/StanceEnum'
        conviction:
          type: integer
          maximum: 32767
          minimum: 0
        bull_case:
          type: string
        bear_case:
          type: string
        key_levels: {}
        watching_for:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
