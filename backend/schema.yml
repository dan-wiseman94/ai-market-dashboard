      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thesis'
          description: ''
    delete:
      operationId: theses_destroy
      description: |-
        Archive the thesis (204). It leaves the list, the coach and the guard, and
        keeps its history.

        PostMortem cascades off Thesis, so dropping the row would take every
        completed post-mortem with it — and with them the conviction calibration,
        Brier score and cohort base rates the scorecard, Mirror and Coach compute
        from decisive post-mortems. It would also leave the review thread and the
        recall documents pointing at a thesis that no longer exists.

        ``?purge=true`` drops the row for real, and only while there is nothing to
        destroy: a thesis with a completed post-mortem answers 409 and must be
        archived instead.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this thesis.
        required: true
      - in: query
        name: purge
        schema:
          type: boolean
        description: true to delete the row outright instead of archiving it. Answers
          409 when a completed post-mortem exists, because dropping the thesis would
          cascade away the calibration it feeds.
      tags:
      - theses
      security:
      - {}
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
