  /api/lessons/:
    get:
      operationId: lessons_list
      description: |-
        Author, review, mute/pin and prune the lessons the Coach draws on.

        List filters (all optional): ``?muted=``, ``?pinned=``, ``?visible=`` (the
        resolved coach-visibility rule). Ordering is pinned first, then best-supported.
      parameters:
      - in: query
        name: muted
        schema:
          type: boolean
        description: Only muted lessons, or only unmuted ones.
      - in: query
        name: pinned
        schema:
          type: boolean
        description: Only pinned lessons, or only unpinned ones.
      - in: query
        name: visible
        schema:
          type: boolean
        description: Filter on the resolved coach-visibility rule (the same rule the
          ``visible_to_coach`` field reports), not on a stored column.
      tags:
      - lessons
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
          description: ''
    post:
      operationId: lessons_create
      description: |-
        Author, review, mute/pin and prune the lessons the Coach draws on.

        List filters (all optional): ``?muted=``, ``?pinned=``, ``?visible=`` (the
        resolved coach-visibility rule). Ordering is pinned first, then best-supported.
      tags:
      - lessons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lesson'
        required: true
      security:
      - {}
      responses:
