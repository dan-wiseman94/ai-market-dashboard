# mutmut (mutation testing) config — see also the pointer in the repo-root pyproject.toml.
#
# WHY THIS LIVES HERE (and not in pyproject.toml):
# mutmut derives each mutant's module name from the *file path* in `paths_to_mutate`
# and reads its config only from the CWD it is launched in. This repo's source root is
# `backend/` (it is on PYTHONPATH; `apps`/`config` import as top-level packages), so mutmut
# MUST run from `backend/` for the path-derived name (`apps.ai.cost`) to match the runtime
# import name the test-coverage stats record (`apps.ai.cost`). When run from the repo root
# with `backend/apps/...` paths, every mutant was named `backend.apps.*`, never matched the
# `apps.*` stats keys, and silently reported "no tests" — i.e. mutation testing was a no-op
# both locally and in nightly CI. mutmut only auto-strips a `src.` prefix, never `backend.`.
#
# A `[mutmut]`-only setup.cfg is ignored by pytest (pytest treats setup.cfg as config only
# when it has a `[tool:pytest]` section), so the normal suite still uses the root pyproject.
#
# `make mutate` / CI launch mutmut from /app/backend (see Makefile + .github/workflows/mutation.yml)
# with DJANGO_SETTINGS_MODULE=config.settings.test and PYTHONPATH cleared so only the mutated
# copy under mutants/ is importable. `-o pythonpath=.` points imports at the mutated tree.
[mutmut]
paths_to_mutate =
    apps/ai/cost.py
    apps/ai/catalog.py
    apps/market/returns.py
    apps/thesis/services/postmortem.py
also_copy =
    apps
    config
    conftest.py
# -p no:randomly: pin definition-order to cut test-order noise from run to run (same reason the
# per-commit gate pins it). NOTE: it does not make results fully reproducible — a few money-path
# survivors flip between runs because the code is time-dependent (forward-return date windows,
# post-mortem horizons keyed off datetime.now()). -o pythonpath=.: import the mutated copy under
# mutants/, not the original source.
pytest_add_cli_args =
    -o
    pythonpath=.
    -p
    no:randomly
# triggers/analytics tests are included because returns.py's trading_day_forward_return_pct /
# nearest_bar_close_within are exercised by their callers' suites, not apps/market/tests — without
# them those mutants report "no tests". (apps/core/tests/test_mutmut_config.py guards every path
# below against going stale.)
pytest_add_cli_args_test_selection =
    apps/ai/tests
    apps/market/tests
    apps/thesis/tests
    apps/observer/triggers/tests
    apps/analytics/tests
