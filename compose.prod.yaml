# Override for prod: build frontend into static files served by web via Whitenoise.
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up

services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
    volumes:
      - ./frontend/dist:/app/frontend/dist:ro
      - app_data:/data
    command:
      [
        "sh",
        "-c",
        "uv run python manage.py collectstatic --noinput && \
         uv run uvicorn config.asgi:application --host 0.0.0.0 --port 8000",
      ]

  frontend:
    profiles: ["build-only"]

  frontend-build:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm run build"]
    profiles: ["build"]
