name: ai-dashboard

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - app_data:/data
    # No host port publish in dev: the `tls-proxy` service owns host 127.0.0.1:8000
    # (HTTPS, for the Schwab OAuth callback) and forwards to web:8000 over the Docker
    # network. The frontend reaches web via the Vite proxy (web:8000), also internal.
    # The prod overlay re-adds a host:8000 publish (plain HTTP, no proxy).
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/health/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app/backend
        - action: rebuild
          path: ./pyproject.toml

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - app_data:/data
    command: ["uv", "run", "celery", "-A", "config", "worker", "-l", "INFO"]
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "INFO",
        "--scheduler",
        "django_celery_beat.schedulers:DatabaseScheduler",
      ]
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend

  # Dev-only HTTPS terminator for host 127.0.0.1:8000. Schwab requires an HTTPS
  # loopback callback; our app serves plain HTTP. Caddy terminates TLS (self-signed
  # via `tls internal`) and reverse-proxies to web:8000, so the post-consent redirect
  # to https://127.0.0.1:8000/api/schwab/callback actually lands. Gated behind the
  # `dev` profile so it never runs in the prod or e2e overlays (which don't activate it).
  tls-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      - web
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    user: "node"
    env_file: .env
    environment:
      CI: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:6006:6006"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/

volumes:
  pg_data:
  redis_data:
  app_data:
  frontend_node_modules:
  caddy_data:
